groups:
  # ==========================================
  # LOG-BASED ALERTS (HTTP 4xx & 5xx Errors)
  # ==========================================
  - name: log-http-error-alerts
    interval: 5m
    rules:
      # High rate of HTTP 4xx Client Errors
      - alert: HighHTTP4xxRate
        expr: |
          sum(rate({service!~"alloy|mimir|loki|grafana|tempo|alertmanager|minio|node-exporter|cadvisor|blackbox-.*"} |~ "(?i)(status[=: ]+4[0-9]{2}|\"4[0-9]{2}\"|HTTP/[12].[01]\" 4[0-9]{2}| 4[0-9]{2} )" | regexp "(?P<http_status>4[0-9]{2})" [5m])) by (service, http_status) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP {{ $labels.http_status }} error rate on {{ $labels.service }}"
          description: "Aplikasi {{ $labels.service }} menghasilkan lebih dari 5 log error HTTP {{ $labels.http_status }} per detik selama 10 menit terakhir. Saat ini {{ $value | printf \"%.1f\" }}/s."
          error_type: "HTTP {{ $labels.http_status }} Client Error"
          error_rate: "{{ $value | printf \"%.1f\" }}"

      # High rate of HTTP 5xx Server Errors
      - alert: HighHTTP5xxRate
        expr: |
          sum(rate({service!~"alloy|mimir|loki|grafana|tempo|alertmanager|minio|node-exporter|cadvisor|blackbox-.*"} |~ "(?i)(status[=: ]+5[0-9]{2}|\"5[0-9]{2}\"|HTTP/[12].[01]\" 5[0-9]{2}| 5[0-9]{2} )" | regexp "(?P<http_status>5[0-9]{2})" [5m])) by (service, http_status) > 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP {{ $labels.http_status }} error rate on {{ $labels.service }}"
          description: "Aplikasi {{ $labels.service }} menghasilkan lebih dari 1 log error HTTP {{ $labels.http_status }} per detik selama 10 menit terakhir. Saat ini {{ $value | printf \"%.1f\" }}/s. Segera investigasi!"
          error_type: "HTTP {{ $labels.http_status }} Server Error"
          error_rate: "{{ $value | printf \"%.1f\" }}"

  # ==========================================
  # INSTANT LOG ALERTS
  # ==========================================
  - name: instant-log-alerts
    interval: 1m
    rules:
      - alert: InstantErrorDetected
        expr: count_over_time({service!~"alloy|mimir|loki|grafana|tempo|alertmanager|minio|node-exporter|cadvisor|blackbox-.*"} |~ "(?i)(error|exception|panic)" [1m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Error detected in {{ $labels.service }}"
          description: "🚨 [Instan] Terdeteksi log Error (error/exception/panic) di aplikasi `{{ $labels.service }}` dalam 1 menit terakhir! Segera cek Grafana Loki!"
