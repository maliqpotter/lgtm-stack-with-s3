groups:
  # ==========================================
  # LOG-BASED ALERTS (HTTP 4xx & 5xx Errors)
  # ==========================================
  - name: log-http-error-alerts
    interval: 5m
    rules:
      # High rate of HTTP 4xx Client Errors
      - alert: HighHTTP4xxRate
        expr: |
          sum(rate({job=~".+"} |~ "(?i)(status[=: ]+4[0-9]{2}|\"4[0-9]{2}\"|HTTP/[12].[01]\" 4[0-9]{2}| 4[0-9]{2} )" [5m])) by (job) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 4xx error rate on {{ $labels.job }}"
          description: "Job {{ $labels.job }} menghasilkan lebih dari 5 log error 4xx per detik selama 10 menit terakhir. Saat ini {{ $value | printf \"%.1f\" }}/s."
          error_type: "4xx Client Error"
          error_rate: "{{ $value | printf \"%.1f\" }}"

      # High rate of HTTP 5xx Server Errors
      - alert: HighHTTP5xxRate
        expr: |
          sum(rate({job=~".+"} |~ "(?i)(status[=: ]+5[0-9]{2}|\"5[0-9]{2}\"|HTTP/[12].[01]\" 5[0-9]{2}| 5[0-9]{2} )" [5m])) by (job) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.job }}"
          description: "Job {{ $labels.job }} menghasilkan lebih dari 1 log error 5xx per detik selama 10 menit terakhir. Saat ini {{ $value | printf \"%.1f\" }}/s. Segera investigasi!"
          error_type: "5xx Server Error"
          error_rate: "{{ $value | printf \"%.1f\" }}"
