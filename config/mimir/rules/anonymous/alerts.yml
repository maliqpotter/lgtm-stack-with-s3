groups:
  # ==========================================
  # BLACKBOX ALERTS (Website & Domain/SSL)
  # ==========================================
  - name: blackbox-alerts
    interval: 5m
    rules:
      # Website / Endpoint Down
      - alert: EndpointDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is DOWN"
          description: "Endpoint {{ $labels.instance }} telah gagal merespons selama lebih dari 15 menit (3 pengecekan berturut-turut)."
          site_name: "{{ $labels.instance }}"

      # Domain / SSL Certificate Expiring Soon (< 30 days)
      - alert: DomainExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30 and probe_ssl_earliest_cert_expiry > 0
        for: 15m
        labels:
          severity: warning
          domain: "{{ $labels.instance }}"
        annotations:
          summary: "SSL certificate for {{ $labels.instance }} expires soon"
          description: "SSL certificate untuk {{ $labels.instance }} akan expired dalam {{ $value | printf \"%.0f\" }} hari."
          days_left: "{{ $value | printf \"%.0f\" }}"

  # ==========================================
  # NODE ALERTS (RAM, CPU, Disk)
  # ==========================================
  - name: node-alerts
    interval: 5m
    rules:
      # High Memory / RAM Usage (> 85%)
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Penggunaan memori pada {{ $labels.instance }} melebihi 85% selama lebih dari 10 menit. Saat ini {{ $value | printf \"%.1f\" }}%."
          used_memory_percent: "{{ $value | printf \"%.1f\" }}"
          node_name: "{{ $labels.instance }}"

      # High CPU Usage (> 85%)
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance, job) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "Penggunaan CPU pada {{ $labels.instance }} melebihi 85% selama lebih dari 10 menit. Saat ini {{ $value | printf \"%.1f\" }}%."
          used_cpu_percent: "{{ $value | printf \"%.1f\" }}"
          node_name: "{{ $labels.instance }}"

      # Low Disk Space (> 85% used)
      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Penggunaan disk pada {{ $labels.instance }} mount {{ $labels.mountpoint }} melebihi 85% selama lebih dari 10 menit. Saat ini {{ $value | printf \"%.1f\" }}%."
          used_disk_percent: "{{ $value | printf \"%.1f\" }}"
          node_name: "{{ $labels.instance }}"
