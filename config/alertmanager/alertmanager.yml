global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  # Pilih salah satu receiver aktif di bawah ini:
  receiver: 'telegram-notifications'
  # receiver: 'discord-notifications'
  # receiver: 'slack-notifications'

receivers:
  # ==========================================
  # 1. TELEGRAM
  # ==========================================
  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token: 'ISI_BOT_TOKEN_ANDA_DISINI'
        chat_id: 123456789
        message: |-
          {{ range .Alerts }}
          {{ if eq .Status "firing" }}🔴 <b>ALERT: {{ .Labels.alertname }}</b>{{ else }}✅ <b>RESOLVED: {{ .Labels.alertname }}</b>{{ end }}
          <b>Status:</b> {{ .Status }}
          <b>Instance:</b> {{ .Labels.instance }}
          <b>Info:</b> {{ .Annotations.summary }}
          <b>Detail:</b> {{ .Annotations.description }}
          {{ end }}
        parse_mode: 'HTML'

  # ==========================================
  # 2. DISCORD
  # ==========================================
  - name: 'discord-notifications'
    discord_configs:
      - webhook_url: 'ISI_WEBHOOK_URL_DISCORD_ANDA_DISINI'
        title: '{{ if eq .Status "firing" }}🔴 ALERT: {{ .GroupLabels.alertname }}{{ else }}✅ RESOLVED: {{ .GroupLabels.alertname }}{{ end }}'
        message: |-
          {{ range .Alerts }}
          **Status:** {{ .Status }}
          **Instance:** {{ .Labels.instance }}
          **Info:** {{ .Annotations.summary }}
          **Detail:** {{ .Annotations.description }}
          {{ end }}

  # ==========================================
  # 3. SLACK
  # ==========================================
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'ISI_WEBHOOK_URL_SLACK_ANDA_DISINI'
        channel: '#alerts'
        title: '{{ if eq .Status "firing" }}🔴 ALERT: {{ .GroupLabels.alertname }}{{ else }}✅ RESOLVED: {{ .GroupLabels.alertname }}{{ end }}'
        text: |-
          {{ range .Alerts }}
          *Status:* {{ .Status }}
          *Instance:* {{ .Labels.instance }}
          *Info:* {{ .Annotations.summary }}
          *Detail:* {{ .Annotations.description }}
          {{ end }}
