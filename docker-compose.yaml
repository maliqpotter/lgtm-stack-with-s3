services:
  minio:
    image: ghcr.io/maliqpotter/minio:release.2025-04-22t22-12-26z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
#   ports:
#     - "9000:9000"   # S3 API
#     - "9001:9001"   # Web Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  minio-init:
    image: ghcr.io/maliqpotter/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/loki-data;
      mc mb --ignore-existing local/tempo-data;
      mc mb --ignore-existing local/mimir-data;
      mc ilm add --expiry-days 3 local/loki-data;
      mc ilm add --expiry-days 3 local/tempo-data;
      mc ilm add --expiry-days 3 local/mimir-data;
      echo 'Buckets created and lifecycle policies applied successfully';
      "
    networks:
      - monitoring

  loki:
    image: ghcr.io/maliqpotter/loki:3.7
    container_name: loki
    restart: unless-stopped
    user: root
#   ports:
#     - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: -config.file=/etc/loki/local-config.yaml -target=all -config.expand-env=true
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  tempo:
    image: ghcr.io/maliqpotter/tempo:2.10.5
    container_name: tempo
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: "-target=all -config.file=/etc/tempo.yaml -config.expand-env=true"
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
#   ports:
#     - "3200:3200"   # HTTP API
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  mimir:
    image: ghcr.io/maliqpotter/mimir:3.0.6
    container_name: mimir
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: ["-config.file=/etc/mimir/config.yaml", "-config.expand-env=true"]
    volumes:
      - ./config/mimir/mimir-config.yml:/etc/mimir/config.yaml:ro
      - mimir-data:/tmp/mimir
#   ports:
#     - "9009:9009"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  alloy:
    image: ghcr.io/maliqpotter/alloy:v1.16.1
    container_name: alloy
    restart: unless-stopped
    privileged: true
    environment:
      - HOSTNAME=${HOSTNAME:-monitoring-server}
    ports:
      - "12345:12345"  # Alloy UI
      - "4317:4317"   # OTLP gRPC (entry point for apps)
      - "4318:4318"   # OTLP HTTP (entry point for apps)
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
      - --disable-reporting
    networks:
      - monitoring
    depends_on:
      - loki
      - tempo
      - mimir

  node-exporter:
    image: ghcr.io/maliqpotter/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
#   ports:
#     - "9100:9100"
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:0.57.0
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
#   ports:
#     - "8080:8080"
    networks:
      - monitoring

  grafana:
    image: ghcr.io/maliqpotter/grafana-oss:13.0.1-security-01
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - monitoring

volumes:
  minio-data:
    name: minio-data
  loki-data:
    name: loki-data
  tempo-data:
    name: tempo-data
  mimir-data:
    name: mimir-data
  grafana-data:
    name: grafana-data

networks:
  monitoring:
    name: monitoring
    driver: bridge
