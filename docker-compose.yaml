services:
  minio:
    image: ghcr.io/maliqpotter/minio:release.2025-04-22t22-12-26z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      monitoring:
        ipv4_address: 177.20.0.2

  minio-init:
    image: ghcr.io/maliqpotter/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/loki-data;
      mc mb --ignore-existing local/tempo-data;
      mc mb --ignore-existing local/mimir-data;
      mc ilm add --expiry-days 45 local/loki-data;
      mc ilm add --expiry-days 45 local/tempo-data;
      mc ilm add --expiry-days 45 local/mimir-data;
      echo 'Buckets created and lifecycle policies applied successfully';
      "
    networks:
      monitoring:

  loki:
    image: ghcr.io/maliqpotter/loki:3.7
    container_name: loki
    restart: unless-stopped
    user: root
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./config/loki/rules:/etc/loki/rules:ro
      - loki-data:/tmp/loki
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: -config.file=/etc/loki/local-config.yaml -target=all -config.expand-env=true
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      monitoring:
        ipv4_address: 177.20.0.3

  tempo:
    image: ghcr.io/maliqpotter/tempo:2.10.5
    container_name: tempo
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: "-target=all -config.file=/etc/tempo.yaml -config.expand-env=true"
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      monitoring:
        ipv4_address: 177.20.0.4

  mimir:
    image: ghcr.io/maliqpotter/mimir:3.0.6
    container_name: mimir
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: ["-config.file=/etc/mimir/config.yaml", "-config.expand-env=true"]
    volumes:
      - ./config/mimir/mimir-config.yml:/etc/mimir/config.yaml:ro
      - ./config/mimir/rules:/etc/mimir/rules:ro
      - mimir-data:/tmp/mimir
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      monitoring:
        ipv4_address: 177.20.0.5

  alertmanager:
    image: ghcr.io/maliqpotter/alertmanager:v0.33.1
    container_name: alertmanager
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.advertise-address=177.20.0.6:9094"]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-your-telegram-bot-token}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:--1}
      - TELEGRAM_MESSAGE_THREAD_ID=${TELEGRAM_MESSAGE_THREAD_ID:-0}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/your-webhook-url}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/your-webhook-url}
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./config/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./config/alertmanager/templates:/etc/alertmanager/templates:ro
    networks:
      monitoring:
        ipv4_address: 177.20.0.6

  alloy:
    image: ghcr.io/maliqpotter/alloy:v1.16.1
    container_name: alloy
    restart: unless-stopped
    privileged: true
    environment:
      - HOSTNAME=${HOSTNAME:-monitoring-server}
    # OTLP ports are NOT exposed publicly.
    # Applications on the same server can connect via:
    #   - Host/other Docker: 177.20.0.7:4317 (gRPC) / 177.20.0.7:4318 (HTTP)
    #   - Docker on monitoring network: alloy:4317 / alloy:4318
    # Uncomment if you need to receive data from a SEPARATE server (e.g. K8s on another host):
    # ports:
    #   - "4317:4317"   # OTLP gRPC
    #   - "4318:4318"   # OTLP HTTP
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
      - --disable-reporting
    networks:
      monitoring:
        ipv4_address: 177.20.0.7
    depends_on:
      - loki
      - tempo
      - mimir

  node-exporter:
    image: ghcr.io/maliqpotter/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      monitoring:
        ipv4_address: 177.20.0.8

  cadvisor:
    image: ghcr.io/maliqpotter/cadvisor:0.57.0
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=io.kubernetes.pod.name,io.kubernetes.pod.namespace'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      monitoring:
        ipv4_address: 177.20.0.9

  blackbox-exporter:
    image: ghcr.io/maliqpotter/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      monitoring:
        ipv4_address: 177.20.0.10

  grafana:
    image: ghcr.io/maliqpotter/grafana-oss:13.0.1-security-01
    container_name: grafana
    restart: unless-stopped
    # Grafana port is exposed for browser access from outside the server
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # --- HTTPS Mode (uncomment to enable) ---
      # First run: bash config/grafana/generate-cert.sh <IP_SERVER>
      # - GF_SERVER_PROTOCOL=https
      # - GF_SERVER_CERT_FILE=/etc/grafana/certs/grafana.crt
      # - GF_SERVER_CERT_KEY=/etc/grafana/certs/grafana.key
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      # --- HTTPS Mode (uncomment to enable) ---
      # - ./config/grafana/certs:/etc/grafana/certs:ro
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      monitoring:
        ipv4_address: 177.20.0.11

volumes:
  minio-data:
    name: minio-data
  loki-data:
    name: loki-data
  tempo-data:
    name: tempo-data
  mimir-data:
    name: mimir-data
  grafana-data:
    name: grafana-data

networks:
  monitoring:
    name: monitoring
    external: true
