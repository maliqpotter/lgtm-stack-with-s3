# Source: alloy/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: monitoring
  labels:
    helm.sh/chart: alloy-1.8.1
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/version: "v1.16.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/component: config
data:
  config.alloy: |-
    logging {
      level  = "info"
      format = "logfmt"
    }

    // --- METRICS PIPELINE ---
    
    // 1. Discovery: Find kube-state-metrics service
    discovery.kubernetes "services" {
      role = "service"
    }

    // 1b. Discovery: Find all endpoints from services (for DaemonSet)
    discovery.kubernetes "endpoints" {
      role = "endpoints"
    }

    discovery.relabel "kube_state_metrics" {
      targets = discovery.kubernetes.services.targets
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        regex         = "kube-state-metrics"
        action        = "keep"
      }
    }

    // 2. Scrape: Collect metrics from kube-state-metrics
    prometheus.scrape "kube_state_metrics" {
      clustering { enabled = true }
      targets    = discovery.relabel.kube_state_metrics.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "kube-state-metrics"
      // Ensures cadvisor/volume metrics are also searchable in prometheus.
    }

    // --- NODE EXPORTER PIPELINE ---

    // 3. Discovery: Find node-exporter service
    discovery.relabel "node_exporter" {
      targets = discovery.kubernetes.endpoints.targets
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        regex         = "node-exporter"
        action        = "keep"
      }
      // Map node name to 'node' label
      rule {
        source_labels = ["__meta_kubernetes_endpoint_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "node_exporter" {
      clustering { enabled = true }
      targets    = discovery.relabel.node_exporter.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "node-exporter"
      scrape_interval = "15s"
    }

    // --- KUBELET & CADVISOR PIPELINE ---
    // Required for per-pod/container specific metrics (e.g. CPU/RAM per Pod)

    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "kubelet" {
      targets    = discovery.relabel.kubelet.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "kubelet"
      scheme     = "https"
      scrape_interval = "15s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
    }

    prometheus.scrape "kubelet_cadvisor" {
      targets    = discovery.relabel.kubelet.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "kubelet"
      scheme     = "https"
      metrics_path = "/metrics/cadvisor"
      scrape_interval = "15s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
    }

    prometheus.scrape "kubelet_resource" {
      targets    = discovery.relabel.kubelet.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "kubelet"
      scheme     = "https"
      metrics_path = "/metrics/resource"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
    }

    prometheus.scrape "kubelet_probes" {
      targets    = discovery.relabel.kubelet.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "kubelet"
      scheme     = "https"
      metrics_path = "/metrics/probes"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
    }

    // --- COREDNS PIPELINE ---
    discovery.relabel "coredns" {
      targets = discovery.kubernetes.endpoints.targets
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        regex         = "kube-dns"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_endpoint_port_name"]
        regex         = "metrics"
        action        = "keep"
      }
    }

    prometheus.scrape "coredns" {
      clustering { enabled = true }
      targets    = discovery.relabel.coredns.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "coredns"
      scrape_interval = "15s"
    }

    // --- KUBERNETES API SERVER PIPELINE ---
    discovery.kubernetes "apiserver" {
      role = "endpoints"
    }

    discovery.relabel "apiserver" {
      targets = discovery.kubernetes.apiserver.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_service_name", "__meta_kubernetes_endpoint_port_name"]
        regex         = "default;kubernetes;https"
        action        = "keep"
      }
    }

    prometheus.scrape "apiserver" {
      clustering { enabled = true }
      targets    = discovery.relabel.apiserver.output
      forward_to = [prometheus.relabel.add_cluster.receiver]
      job_name   = "apiserver"
      scheme     = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = true
      }
    }

    // --- GLOBAL RELABELING ---
    // Inject cluster name to all metrics
    prometheus.relabel "add_cluster" {
      forward_to = [otelcol.receiver.prometheus.default.receiver]
      rule {
        target_label = "cluster"
        replacement  = coalesce(sys.env("CLUSTER_NAME"), "kubernetes")
      }
    }

    // --- BRIDGE ---

    // 5. Bridge: Convert Prometheus metrics to OTLP so they can be sent over the tunnel
    otelcol.receiver.prometheus "default" {
      output {
        metrics = [otelcol.processor.batch.default.input]
      }
    }

    // --- LOGS PIPELINE ---

    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Filter: Only collect logs from development and monitoring namespaces
    discovery.relabel "logs_filter" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "development|monitoring"
        action        = "keep"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.logs_filter.output
      forward_to = [loki.process.add_label.receiver]
    }

    loki.process "add_label" {
      forward_to = [otelcol.receiver.loki.default.receiver]
      stage.static_labels {
        values = {
          cluster = sys.env("CLUSTER_NAME"),
        }
      }
    }

    otelcol.receiver.loki "default" {
      output {
        logs = [otelcol.processor.batch.default.input]
      }
    }

    // --- PROCESSOR ---
    
    // Batch Processor mengumpulkan data sebelum dikirim (sangat penting untuk efisiensi tunnel)
    otelcol.processor.batch "default" {
      timeout = "5s"
      send_batch_size = 1000
      
      output {
        metrics = [otelcol.exporter.otlp.monitoring_server.input]
        logs    = [otelcol.exporter.otlp.monitoring_server.input]
      }
    }

    // --- EXPORTER ---
    
    otelcol.exporter.otlp "monitoring_server" {
      client {
        endpoint = sys.env("MONITORING_ENDPOINT")
        tls { insecure = true }
      }
      // Tambahkan queue agar lebih kuat menampung data
      sending_queue {
        enabled    = true
        queue_size = 10000
      }
    }
