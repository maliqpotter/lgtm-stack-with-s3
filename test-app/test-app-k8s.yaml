apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: default
  labels:
    app: test-app
spec:
  replicas: 2 # Bisa diubah sesuai kebutuhan (misal jadi lebih kompleks)
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: test-app
          # Make sure you have built and pushed this image to your registry first
          # Example: docker build -t ghcr.io/your-username/test-api:latest .
          image: ghcr.io/your-username/test-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "test-api"
            # Since your K8s is on a separate server, you can send OTLP directly to the Monitoring Server
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://<IP_SERVER_MONITORING>:4318" 
---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: test-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
